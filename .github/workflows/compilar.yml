name: Compilar EV

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  compilar:
    runs-on: windows-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restaurar dependencias
        run: dotnet restore EV/EV.csproj

      - name: Descargar modelo de voz en español
        shell: pwsh
        run: |
          $url = "https://alphacephei.com/vosk/models/vosk-model-small-es-0.42.zip"
          $zip = Join-Path $env:RUNNER_TEMP "vosk-es.zip"
          $models = Join-Path $env:GITHUB_WORKSPACE "EV\models"

          New-Item -ItemType Directory -Force -Path $models | Out-Null
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $models -Force
          Remove-Item $zip -Force

      - name: Publicar EV
        run: dotnet publish EV/EV.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o salida

      - name: Incluir modelo de voz en la publicación
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "EV\models"
          $target = Join-Path $env:GITHUB_WORKSPACE "salida\models"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item -Path (Join-Path $source "vosk-model-small-es-0.42") -Destination $target -Recurse -Force

      - name: Subir EV
        uses: actions/upload-artifact@v4
        with:
          name: EV-Windows-x64
          path: salida/